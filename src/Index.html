<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f7f9;color:#17191c}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.btn{border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}.primary{background:#111;color:#fff}.muted{color:#666}.option{display:block;border:1px solid #ddd;border-radius:10px;padding:11px;margin:8px 0}.progress{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden}.bar{height:100%;background:#333}.scores{width:100%;border-collapse:collapse}.scores td,.scores th{padding:8px;border-bottom:1px solid #eee;text-align:left}select{font-size:16px;padding:10px;width:100%}.error{color:#9b1c1c;white-space:pre-wrap}.hidden{display:none}
  </style>
</head>
<body><div class="wrap">
  <h1>UALP</h1>
  <div id="status" class="muted">Loading…</div>
  <div id="start" class="card">
    <label>Assessment</label>
    <select id="formKey">
      <option value="ONET_SHORT_60_DIGITAL">RIASEC — 60</option>
      <option value="UALP_WV21_RU_LIKERT">Work Values — 21</option>
      <option value="ICAR16_DIGITAL">Cognitive Core — ICAR-16</option>
    </select>
    <p class="muted">Development/pilot results are exploratory.</p>
    <button class="btn primary" onclick="begin()">Start</button>
  </div>
  <div id="test" class="hidden"></div>
  <div id="result" class="hidden"></div>
  <div id="error" class="error"></div>
</div>
<script>
let run=null, answers={}, qIndex=0;
const userId = localStorage.getItem('ualpDevUserId') || ('DEVUSER-'+crypto.randomUUID());
localStorage.setItem('ualpDevUserId',userId);
function reqId(){return crypto.randomUUID();}
function fail(e){document.getElementById('error').textContent=(e&&e.message)||String(e);}
function begin(){
  document.getElementById('error').textContent='';
  google.script.run.withSuccessHandler(r=>{run=r;answers={};qIndex=0;document.getElementById('start').classList.add('hidden');document.getElementById('test').classList.remove('hidden');renderQ();}).withFailureHandler(fail)
    .startAssessment({formKey:document.getElementById('formKey').value,locale:'ru',userId:userId,clientRequestId:reqId()});
}
function renderQ(){
  const q=run.questions[qIndex], root=document.getElementById('test');
  const pct=Math.round((qIndex/run.questions.length)*100);
  root.innerHTML=`<div class="card"><div class="progress"><div class="bar" style="width:${pct}%"></div></div><p class="muted">${qIndex+1} / ${run.questions.length}</p>${(q.assets||[]).map(a=>a.uri?`<img src="${esc(a.uri)}" alt="" style="max-width:100%;height:auto">`:'').join('')}<h2>${esc(q.prompt)}</h2><div id="opts"></div></div>`;
  const opts=root.querySelector('#opts');
  q.options.forEach(o=>{const id=o.itemOptionId||o.responseOptionId; const el=document.createElement('label');el.className='option';el.innerHTML=`<input type="radio" name="ans" value="${esc(id)}"> ${esc(o.label)}`;el.querySelector('input').onchange=()=>{answers[q.itemId]=q.answerKind==='ITEM_OPTION'?{itemId:q.itemId,itemOptionId:id}:{itemId:q.itemId,responseOptionId:id};setTimeout(nextQ,120)};opts.appendChild(el);});
}
function nextQ(){if(qIndex<run.questions.length-1){qIndex++;renderQ();}else submit();}
function submit(){
  const responses=run.questions.map(q=>answers[q.itemId]).filter(Boolean);
  if(responses.length!==run.questions.length){fail(new Error('Please answer every question.'));return;}
  document.getElementById('test').innerHTML='<div class="card">Scoring…</div>';
  google.script.run.withSuccessHandler(showResult).withFailureHandler(fail).submitAssessment({assessmentRunId:run.assessmentRunId,clientRequestId:reqId(),responses});
}
function showResult(r){
  document.getElementById('test').classList.add('hidden');const root=document.getElementById('result');root.classList.remove('hidden');
  root.innerHTML=`<div class="card"><h2>Result</h2><p class="muted">Exploratory pilot result.</p><table class="scores"><thead><tr><th>Scale</th><th>Score</th></tr></thead><tbody>${r.scores.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.rawScore}</td></tr>`).join('')}</tbody></table><p><button class="btn" onclick="location.reload()">Another test</button></p></div>`;
}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
google.script.run.withSuccessHandler(s=>document.getElementById('status').textContent=`${s.appName} ${s.appVersion} · ${s.environment} · ${s.buildDate}`).withFailureHandler(fail).getRuntimeStatus();
</script></body></html>
