name: UALP PostgreSQL candidate checks
on:
  push:
    branches: ['feature/ualp-mvp-001-postgres-test', 'feature/ualp-mvp-001-vercel-test', 'feature/ualp-mvp-002-history-test', 'feature/ualp-mvp-003-profile-test']
  pull_request:
    paths: ['app.py','webapp/**','tests/**','migrations/**','requirements*.txt','.python-version']
jobs:
  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py webapp
      - name: Validate mobile UI inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('webapp/index.html').read_text(encoding='utf-8')
          assert html.count('<script>')==1 and html.count('</script>')==1
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/ualp-ui.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/ualp-ui.js
      - run: python -m pytest -q
      - name: Verify no Apps Script and no committed credentials
        shell: bash
        run: |
          set -euo pipefail
          ! find webapp -type f \( -name '*.gs' -o -name 'appsscript.json' \) | grep .
          if grep -RIEe '-----BEGIN (RSA|OPENSSH|PRIVATE) KEY-----|ghp_[A-Za-z0-9]{30}|postgres(ql)?://[^[:space:]]+:[^[:space:]]+@' webapp tests; then
            echo 'Potential credential found'; exit 1
          fi
