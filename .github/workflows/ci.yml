name: UALP CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run deterministic tests
        run: npm test
      - name: Parse Apps Script source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          for (const file of fs.readdirSync('src').filter(x => x.endsWith('.gs'))) {
            const source = fs.readFileSync(path.join('src', file), 'utf8');
            new Function(source);
            console.log(`${file}: syntax PASS`);
          }
          NODE
